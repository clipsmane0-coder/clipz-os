version: "3.9"

services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/clipz.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=INFO
    volumes:
      - clipz_data:/app/data
      - clipz_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_MODE=real
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  clipz_data:
  clipz_storage: